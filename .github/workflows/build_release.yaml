# Tests frustbite, builds and verifies its native libraries, stages the package
# for pub.dev and, on a `frustbite-v<version>` tag, creates the GitHub Release.
# Publishing to pub.dev stays manual (see CONTRIBUTING.md).
name: frustbite_prebuild_assets

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build_release.yaml
      - native/**
      - packages/frustbite/**
      - pubspec.yaml
      - tool/**
  push:
    tags:
      - "frustbite-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails a release tag in seconds instead of after the full build matrix.
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frustbite/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check release versions
        if: startsWith(github.ref, 'refs/tags/frustbite-v')
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          crate=$(awk -F'"' '/^version = /{print $2; exit}' ../../native/Cargo.toml)
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF_NAME" = "frustbite-v$version" ] \
            || fail "Tag $GITHUB_REF_NAME does not match pubspec version $version"
          [ "$crate" = "$version" ] \
            || fail "native/Cargo.toml version $crate does not match pubspec version $version"
          grep -Fqx "## $version" CHANGELOG.md \
            || fail "CHANGELOG.md has no '## $version' section"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "Release tags must point at a commit on main"

  rust:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep the version in sync with native/rust-toolchain.toml. The extra
      # `rustup toolchain install` adds the pinned targets and components.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: cargo-registry-
      - run: cargo fmt --check
      # THIRD_PARTY_LICENSES.md (root and package copy) must match Cargo.lock.
      - run: python3 -I tool/third_party_licenses.py --check
      - run: cargo clippy --all-targets -- -D warnings
      # A reduced format set must still compile without warnings.
      - run: cargo clippy --all-targets --no-default-features --features wav -- -D warnings
      - run: cargo test
      # The release profile unwinds (a test checks catch_unwind), so test it too.
      - run: cargo test --release
      - run: cargo test --no-default-features --features wav

  dart:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        working-directory: packages/frustbite/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      # The workspace's `local_build: true` makes the build hook compile the
      # crate from source, so Rust is required on every runner.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - run: rustup toolchain install
        working-directory: native/
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  wasm:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frustbite/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - run: rustup toolchain install
        working-directory: native/
      - run: dart pub get
      - run: dart tool/build_wasm.dart test/frustbite.wasm
      # Only the wasm test runs in the browser; the other tests use dart:io.
      - run: dart test -p chrome test/frustbite_wasm_test.dart
      - run: dart test -p chrome --compiler dart2wasm test/frustbite_wasm_test.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: packages/frustbite/test/frustbite.wasm
          if-no-files-found: error

  # Release binaries are built from a clean cargo target dir on purpose: cargo
  # does not fingerprint MACOSX_DEPLOYMENT_TARGET / IPHONEOS_DEPLOYMENT_TARGET,
  # so a cached native/target could ship binaries with the wrong minimum OS.
  # Do not add a cache for native/target here.
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux assets are cross-built with cargo-zigbuild against glibc 2.17, so
          # any runner works and they load on older distros.
          - { target: android_armv7, runner: ubuntu-latest }
          - { target: android_arm64, runner: ubuntu-latest }
          - { target: android_x86_64, runner: ubuntu-latest }
          - { target: linux_aarch64, runner: ubuntu-latest }
          - { target: linux_x86_64, runner: ubuntu-latest }
          - { target: ios_arm64, runner: macos-latest }
          - { target: ios_sim_arm64, runner: macos-latest }
          - { target: ios_sim_x86_64, runner: macos-latest }
          - { target: macos_arm64, runner: macos-latest }
          - { target: macos_x86_64, runner: macos-latest }
          - { target: windows_arm64, runner: windows-latest }
          - { target: windows_x86_64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: packages/frustbite/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - run: rustup toolchain install
        working-directory: native/

      # glibc 2.17 floor: tool/build.dart runs `cargo zigbuild --target
      # <triple>.2.17` when FRUSTBITE_ZIGBUILD=1. Versions are pinned.
      # ziglang goes into a virtual environment: newer Ubuntu images mark the
      # system Python as externally managed (PEP 668), which makes a plain
      # `pip install`, and `--user` as well, fail. A venv needs no
      # `--break-system-packages` and leaves the runner's Python alone; its
      # bin directory (with the `zig` launcher) goes on PATH for the build.
      - name: Install zig and cargo-zigbuild
        if: startsWith(matrix.target, 'linux_')
        run: |
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install ziglang==0.17.1
          echo "$RUNNER_TEMP/zig-venv/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.1 --locked

      # Uses the NDK preinstalled on GitHub's ubuntu runners; tool/build.dart
      # reads ANDROID_NDK_ROOT.
      - name: Select the Android NDK
        if: startsWith(matrix.target, 'android_')
        run: echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: dart pub get
      # Writes libs/<target>/<one file name>.
      - name: Build
        env:
          FRUSTBITE_ZIGBUILD: ${{ startsWith(matrix.target, 'linux_') && '1' || '0' }}
        run: dart tool/build.dart libs ${{ matrix.target }}

      # Git Bash on every runner OS. Windows needs llvm-objdump (preinstalled
      # with LLVM on windows-latest, C:\Program Files\LLVM\bin) or dumpbin.
      - name: Verify the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          files=(libs/"$TARGET"/*)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected one file in libs/$TARGET"; exit 1; }
          ../../tool/verify_native.sh "${files[0]}" "$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.target }}
          # Keeps the libs/<target>/<file> layout inside the artifact.
          path: packages/frustbite/libs/
          if-no-files-found: error

  # Stages the package exactly as it would be published, from the libraries
  # this run built, and dry-runs `dart pub publish` on it. Runs on pull
  # requests and manual runs too, so staging is tested before any tag.
  stage:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frustbite/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          merge-multiple: true
          path: packages/frustbite/libs/
      - run: dart pub get
      # Fails with fewer than 12 libraries; --allow-partial is never used here.
      - name: Stage the package
        run: dart tool/stage_package.dart --from-dir libs --out "$RUNNER_TEMP/frustbite"
      - name: Check the staged .pubignore
        run: dart tool/check_pubignore.dart "$RUNNER_TEMP/frustbite"
      - name: Publish dry run
        working-directory: ${{ runner.temp }}/frustbite
        run: dart pub publish --dry-run
      # The release publishes the checksums the staged package carries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: ${{ runner.temp }}/frustbite/prebuilt/checksums.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/frustbite-v')
    needs: [rust, dart, build, wasm, stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          merge-multiple: true
          path: libs/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: assets/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: assets/
      # The artifacts hold libs/<target>/<one file name>. Release assets need
      # unique names, so each file becomes libfrustbite_<target>.<ext> (the
      # names the release has always used).
      - name: Flatten the libraries into release assets
        run: |
          for dir in libs/*/; do
            target="$(basename "$dir")"
            for file in "$dir"*; do
              case "$file" in
                *.dylib) name="libfrustbite_${target}.dylib" ;;
                *.dll) name="frustbite_${target}.dll" ;;
                *.so) name="libfrustbite_${target}.so" ;;
                *) echo "::error::Unexpected file $file"; exit 1 ;;
              esac
              cp "$file" "assets/$name"
            done
          done
      # Third-party notices must ship with the binaries (the rust job checks
      # the file is up to date with Cargo.lock).
      - name: Add the third-party licenses
        run: cp THIRD_PARTY_LICENSES.md assets/
      - name: Check the asset list
        env:
          # Keep in sync with the build matrix targets. The release holds one
          # file per target (12), frustbite.wasm, THIRD_PARTY_LICENSES.md and
          # checksums.json (15).
          TARGETS: >-
            android_armv7 android_arm64 android_x86_64 linux_aarch64 linux_x86_64
            ios_arm64 ios_sim_arm64 ios_sim_x86_64 macos_arm64 macos_x86_64
            windows_arm64 windows_x86_64
        run: |
          ls -l assets/
          expected=(frustbite.wasm THIRD_PARTY_LICENSES.md checksums.json)
          for target in $TARGETS; do
            case "$target" in
              ios_* | macos_*) expected+=("libfrustbite_${target}.dylib") ;;
              windows_*) expected+=("frustbite_${target}.dll") ;;
              *) expected+=("libfrustbite_${target}.so") ;;
            esac
          done
          missing=0
          for name in "${expected[@]}"; do
            [ -f "assets/$name" ] || { echo "::error::Missing asset $name"; missing=1; }
          done
          [ "$(find assets -type f | wc -l)" -eq "${#expected[@]}" ] \
            || { echo "::error::Unexpected extra assets"; missing=1; }
          exit "$missing"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
