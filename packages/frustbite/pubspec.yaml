name: frustbite
description: "Read and edit audio in Dart and Flutter: decode MP3, AAC, FLAC, Opus and more, read tags and cover art, draw waveforms, trim, mix and save as WAV."
version: 0.0.3
repository: https://github.com/sb-dor/frustbite
homepage: https://sb-dor.github.io/frustbite/
issue_tracker: https://github.com/sb-dor/frustbite/issues
topics: [audio, waveform, ffi, wasm, rust]
screenshots:
  - description: "The frustbite showcase app on iPhone: stream info, tags, cover art and a waveform, next to an editing example."
    path: doc/showcase.webp
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.8
  ffi: ^2.2.0
  hooks: ^2.2.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.1.0
  path: ^1.9.1
  test: ^1.33.0
