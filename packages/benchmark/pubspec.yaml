name: frustbite_benchmark
description: Benchmarks comparing frustbite with existing Dart audio packages.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  frustbite:
    path: ../frustbite
  benchmark_harness: ^2.4.0
  # Baselines (dev-time only, never shipped with frustbite).
  audio_decode: ^1.3.6
  glint_audio_pure: ^0.7.0
  wav: ^1.5.0
  audio_metadata_reader: ^1.8.1

dev_dependencies:
  lints: ^6.1.0
