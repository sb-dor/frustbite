<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frustbite benchmarks</title>
<style>
  :root { --bg:#ffffff; --fg:#1b1f24; --muted:#5b6570; --grid:#e3e7eb;
          --c0:#1f6feb; --c1:#e0a42b; --c2:#8a5cc2; --c3:#2a9d8f; --c4:#c2410c; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg);
         font:14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #meta { color: var(--muted); margin: 0 0 12px; }
  #legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin: 0 0 8px; }
  #legend span { display:inline-flex; align-items:center; gap:6px; }
  #legend i { width:12px; height:12px; border-radius:2px; display:inline-block; }
  svg { width:100%; height:auto; display:block; }
  svg text { fill: var(--fg); font-size: 12px; }
  svg .muted { fill: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>frustbite vs Dart audio packages</h1>
  <p id="meta"></p>
  <div id="legend"></div>
  <div id="chart"></div>
  <p class="note">Median time per operation, log scale, lower is better. Operations a
  package cannot do have no bar.</p>
</main>
<script id="data" type="application/json">
{
  "timestamp": "2026-11-24T13:36:14.922581",
  "machine": "Apple M3 Pro, 11 cores",
  "dart": "3.14.0",
  "results": {
    "info_mp3": {
      "frustbite_us": 959.0
    },
    "decode_mp3": {
      "frustbite_us": 95409.0,
      "audio_decode_us": 83160.5,
      "glint_audio_pure_us": 7955930.0
    },
    "decode_vorbis": {
      "frustbite_us": 106695.5,
      "audio_decode_us": 124731.0
    },
    "decode_flac": {
      "frustbite_us": 78317.5
    },
    "decode_wav": {
      "frustbite_us": 24916.0,
      "wav_us": 225566.0,
      "audio_decode_us": 29248.0
    },
    "waveform_mp3_1000": {
      "frustbite_us": 93139.5,
      "audio_decode_us": 88746.0
    },
    "tags_mp3": {
      "frustbite_us": 95.0,
      "audio_metadata_reader_us": 89.0
    }
  }
}
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var series = [
    ['frustbite', 'frustbite', '--c0'],
    ['audio_decode', 'audio_decode', '--c1'],
    ['glint_audio_pure', 'glint_audio_pure', '--c2'],
    ['wav', 'wav', '--c3'],
    ['audio_metadata_reader', 'audio_metadata_reader', '--c4']
  ];
  var css = getComputedStyle(document.documentElement);
  function color(v) { return css.getPropertyValue(v).trim(); }
  var keys = Object.keys(data.results);
  document.getElementById('meta').textContent =
    [data.timestamp && data.timestamp.slice(0, 10), data.machine, data.dart && 'Dart ' + data.dart]
      .filter(Boolean).join(' · ');

  var used = series.filter(function (s) {
    return keys.some(function (k) { return data.results[k][s[0] + '_us'] != null; });
  });
  document.getElementById('legend').innerHTML = used.map(function (s) {
    return '<span><i style="background:' + color(s[2]) + '"></i>' + s[1] + '</span>';
  }).join('');
  if (!keys.length) return;

  var W = 1000, H = 440, L = 70, R = 10, T = 16, B = 70;
  var all = [];
  keys.forEach(function (k) { series.forEach(function (s) {
    var v = data.results[k][s[0] + '_us']; if (v != null) all.push(v / 1000);
  }); });
  var lo = Math.pow(10, Math.floor(Math.log10(Math.min.apply(null, all))));
  var hi = Math.pow(10, Math.ceil(Math.log10(Math.max.apply(null, all))));
  function y(ms) {
    return T + (H - T - B) * (1 - (Math.log10(ms) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)));
  }
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grouped bar chart of median milliseconds per operation">';
  for (var p = Math.log10(lo); p <= Math.log10(hi) + 1e-9; p++) {
    var ms = Math.pow(10, p), yy = y(ms);
    out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + color('--grid') + '"/>';
    out += '<text class="muted" x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + (ms >= 1 ? ms : ms) + ' ms</text>';
  }
  var gw = (W - L - R) / keys.length;
  keys.forEach(function (k, gi) {
    var present = series.filter(function (s) { return data.results[k][s[0] + '_us'] != null; });
    var bw = Math.min(26, (gw - 16) / present.length);
    var x0 = L + gi * gw + (gw - bw * present.length) / 2;
    present.forEach(function (s, i) {
      var ms = data.results[k][s[0] + '_us'] / 1000, top = y(ms), base = y(lo);
      out += '<rect x="' + (x0 + i * bw) + '" y="' + top + '" width="' + (bw - 2) + '" height="' + (base - top) +
             '" rx="2" fill="' + color(s[2]) + '"><title>' + s[1] + ': ' + ms.toFixed(2) + ' ms</title></rect>';
      out += '<text x="' + (x0 + i * bw + (bw - 2) / 2) + '" y="' + (top - 4) + '" text-anchor="middle" style="font-size:10px">' +
             (ms >= 100 ? ms.toFixed(0) : ms >= 10 ? ms.toFixed(1) : ms.toFixed(2)) + '</text>';
    });
    out += '<text x="' + (L + gi * gw + gw / 2) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + k + '</text>';
  });
  out += '</svg>';
  document.getElementById('chart').innerHTML = out;
})();
</script>
</body>
</html>
