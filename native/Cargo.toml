[package]
name = "frustbite"
version = "0.0.2"
edition = "2024"
license = "MIT"

[lib]
name = "frustbite"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Pure-Rust demuxers and decoders. Codecs and containers are enabled per Cargo feature below.
# Pinned exactly: probe.rs works around symphonia-core 0.6.1 packet.rs:340 (MP3 trims left in
# `dur`); an upstream fix would make that workaround subtract twice. Re-check on any bump.
symphonia = { version = "=0.6.1", default-features = false, features = ["id3v1", "id3v2"] }
# Also pinned directly: the buggy `PacketBuilder` lives in symphonia-core, which `symphonia`
# alone would let float within 0.6.x.
symphonia-core = "=0.6.1"
opus-pure = { version = "=0.2.5", optional = true, default-features = false }
lofty = "0.25.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep in sync with `supportedFormats` in packages/frustbite/lib/src/hook/local_build.dart.
[features]
default = ["mp3", "aac", "alac", "flac", "vorbis", "opus", "wav"]
mp3 = ["symphonia/mp3"]
aac = ["symphonia/aac", "symphonia/isomp4"]
alac = ["symphonia/alac", "symphonia/isomp4"]
flac = ["symphonia/flac"]
vorbis = ["symphonia/vorbis", "symphonia/ogg"]
opus = ["dep:opus-pure", "symphonia/ogg", "symphonia/mkv"]
wav = ["symphonia/wav", "symphonia/pcm"]

# `unwind`, not `abort`: the FFI layer catches decoder panics on malformed input and reports
# them as `Unknown` instead of killing the host app. wasm32-unknown-unknown cannot unwind,
# so there a panic still traps.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
