# Linker flags for the cdylib live in build.rs: RUSTFLAGS from the environment
# replace the rustflags below, but never build.rs output.

# Windows: link the C runtime statically, so the DLL loads without the VC++
# redistributable (clean servers, Nano Server). Contains MIT-licensed third-party code; see THIRD_PARTY_LICENSES.md.
# This stays here because build.rs cannot set `-C target-feature`.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
